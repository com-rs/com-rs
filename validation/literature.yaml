# Comparisons of com-rs with the literature: one entry per document of references/
# (status "have"), per reference implementation, and per document whose values are
# quoted without the file. `python3 tools/literature_table.py` renders docs/LITERATURE.md
# and checks that every test named here exists (`just check`).
#
# badge:
#   green  - the published values (tables, closed forms, points of figures within a stated
#            tolerance, claims of the text) are reproduced by automated tests;
#   orange - partly: a qualitative comparison, a loose tolerance, a subset of the
#            document, values quoted without the document, or an unexplained gap;
#   red    - the code follows the document but no test compares it with its values.
# remarks: inconsistencies found in the document itself (misprints, figures that
#   contradict the text); they do not lower the badge when the corrected result is
#   reproduced.
#
# tests: `path` or `path::name` (the name must appear in the file).

- id: caire1998
