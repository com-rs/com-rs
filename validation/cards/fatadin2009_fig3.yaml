id: fatadin2009_fig3
title: OSNR penalty of blind equalisers of 7 taps compensating chromatic dispersion on 16-QAM
literature: fatadin2009
source:
  kind: paper
  reference: "I. Fatadin, D. Ives, S. J. Savory, Blind equalization and carrier phase recovery in a 16-QAM optical coherent system, J. Lightw. Technol. 27(15), 3042-3049, 2009"
  locator: "Fig. 3 (OSNR penalty at a BER of 1e-3), Sec. II-III, eqs. (4), (5), (9), (10)"
  file: fiber/2009_fatadin_blind-equalization-phase-recovery-16qam_jlt.pdf
description: >
  Gray 16-QAM at 14 GBd, root-raised-cosine pulses of roll-off 1 at the transmitter and
  the receiver (two samples per symbol), a lossless fibre of 17 ps/(nm km) giving the
  dispersion of the abscissa (comrs::channel::optical::fiber::linear_fiber_channel), noise
  at the OSNR of the paper (signal power over the noise in 12.5 GHz, all in the detected
  polarisation: Es/N0 = OSNR 12.5/14), a 6-bit quantiser at the loading that minimises
  the error of a Gaussian, then the butterfly equaliser of 7 taps at T/2 with mu = 1e-3
  (comrs::dsp::equalizer::AdaptiveEqualizer: CMA, RDE, DD-LMS from the identity, without
  CMA pre-convergence) or the symbol instants without equaliser, then the loop of eq. (11)
  with mu_phi = 0.01 (no laser phase noise: it removes the constant phase of the dispersion
  and the drift of the phase of the blind equalisers). The OSNR at a BER of 1e-3 (records
  of 400 000 symbols, BER on the second half, sweep by 0.5 dB, log-linear interpolation)
  minus that of the theory (17.035 dB) is the penalty.
run:
  test: validation/tests/fatadin2009.rs::fatadin_2009_fig_3_cd_compensation
tier: campaign
duration: "9 s on an Apple M6 (release)"
tolerance: {atol: 0.3}
why: >
  the figure read to 0.05 dB; the receiver of the paper also has a 50-GHz optical filter
  and a fifth-order Bessel anti-aliasing filter of 0.8 times the symbol rate, which
  com-rs does not have, and the scale of its signal, which sets the effective step of the
  CMA and RDE, is not given: 0.3 dB is the agreement obtained (the largest gap is 0.25 dB)
findings:
  - "the CMA is 0.2 dB better than the figure up to 750 ps/nm (0.30, 0.41, 0.45, 0.57 dB against 0.5, 0.6, 0.7, 0.8) and 0.4 dB worse at 1000 ps/nm (1.38 against 1.0): its 7 taps converge more slowly as the dispersion fills them"
  - "the DD-LMS started from the identity converges up to 500 ps/nm (0.04, 0.22, 0.29 dB against 0, 0.1, 0.28) but not at 750 and 1000 ps/nm, where the paper reports 0.5 and 0.65 dB: there the eye is closed before equalisation (the link without equaliser loses 4.9 dB at 300 ps/nm), outside the open-eye condition (8) the paper quotes, so the decisions do not drive the taps to the inverse of the channel within 200 000 symbols"
  - "without equaliser the penalty grows faster than on the figure: 0.55, 1.95 and 4.85 dB at 100, 200 and 300 ps/nm against 0.3, 1.3 and 3.5. The narrower receiver of the paper (the Bessel filter of 0.8 Rs after the matched filter) shortens the dispersed pulse; com-rs has no Bessel filter to check it"
  - "the RLS-CMA of Table I is not in com-rs; its curve is not compared"
