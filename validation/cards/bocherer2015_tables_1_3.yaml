id: bocherer2015_tables_1_3
title: The SNRs at which shaped and uniform ASK, the capacity and bit-metric decoding reach m - 1 bits
literature: bocherer2015
source:
  kind: paper
  reference: "G. Böcherer, F. Steiner, P. Schulte, Bandwidth efficient and rate-matched low-density parity-check coded modulation, IEEE Trans. Commun. 63(12), 4651-4665, 2015 (arXiv:1502.02733v2, the numbering of its tables)"
  locator: "Tables I and III of arXiv:1502.02733v2"
  file: coding/2015_bocherer_pas-ldpc_tcom_arxiv.pdf
description: >
  For 2^m-ASK (m = 2 to 6) at the rate m - 1 bits per channel use: the SNR at which the
  mutual information of the optimised Maxwell-Boltzmann input (eqs. 8-10), of the
  uniform input and the capacity 1/2 log2(1 + P) (eq. 1) reach the rate, the shaping
  gaps, and (Table III) the SNR at which the rate of bit-metric decoding with the BRGC
  labelling (eq. 50, the labels of Table II) of the Maxwell-Boltzmann input reaches it
  (com_validation::shaping: mi_ask, bmd_ask, snr_for, snr_mb).
run:
  test: validation/tests/bocherer2015.rs::bocherer_2015_table_i_and_iii_shaping_gaps_of_ask
tier: ci
why: "printed to four decimals; the SNRs are found by bisection on the quadratures of the rates, which agree within 2e-4 dB"
