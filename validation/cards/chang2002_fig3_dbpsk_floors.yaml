id: chang2002_fig3_dbpsk_floors
title: Error floors of DBPSK over Jakes' fading
literature: chang2002
source:
  kind: paper
  reference: "M.-X. Chang, Y. T. Su, Performance analysis of equalized OFDM systems in Rayleigh fading, IEEE Trans. Wireless Commun. 1(4), 721-732, 2002"
  locator: "Fig. 3 (eq. 40), read at Eb/N0 = 50 dB"
  file: multicarrier/2002_chang_equalized-ofdm-rayleigh_twc.pdf
run:
  function: comrs.theory_ber_dpsk_jakes
tolerance: {rtol: 0.3}
why: "values read on the figure"
note: "the curve labelled fD Ts = 0.05 floors where eq. 40 puts fD Ts = 0.005, a misprint of the label"
cases:
  - inputs: {m: 2, ebn0_db: 50.0, fd_ts: 0.01}
    expected: 5.0e-4
  - inputs: {m: 2, ebn0_db: 50.0, fd_ts: 0.005}
    expected: 1.3e-4
    note: "the curve labelled 0.05 on the figure"
  - inputs: {m: 2, ebn0_db: 50.0, fd_ts: 0.001}
    expected: 1.3e-5
  - inputs: {m: 2, ebn0_db: 50.0, fd_ts: 0.05}
    expected: {min: 1.0e-2}
    note: "eq. 40 at the label of the figure: a floor of 1.2e-2, far above the curve so labelled"
