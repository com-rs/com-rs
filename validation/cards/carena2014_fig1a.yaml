id: carena2014_fig1a
title: Self-channel interference of PM-QPSK by the GN and EGN models
literature: carena2014
source:
  kind: paper
  reference: "A. Carena, G. Bosco, V. Curri, Y. Jiang, P. Poggiolini, F. Forghieri, EGN model of non-linear fiber propagation, Opt. Express 22(13), 16335-16362, 2014"
  locator: "Fig. 1(a), the GN and EGN curves read at 1, 10, 20 and 50 spans"
description: >
  One channel of PM-QPSK at 32 GBd (raised-cosine spectrum of roll-off 0.05) over spans
  of 100 km of SMF (D = 16.7 ps/(nm km), gamma = 1.3 /(W km), 0.22 dB/km): the
  self-channel interference eta_SCI = P^-3 times the integral of G_SCI over the band
  (comrs::channel::optical::gn::GnModel::nli_psd, Simpson's rule on 16 intervals), in
  dB(1/W^2), of the GN model and of the EGN model with the moments of QPSK.
run:
  test: validation/tests/carena2014.rs::sci_of_pm_qpsk_follows_fig_1a_of_carena_2014
tier: campaign
duration: "about 40 s on an Apple M6"
why: "Fig. 1(a) read to about 0.1 dB; 0.2 dB (GN) and 0.25 dB (EGN) are the agreement obtained"
findings:
  - "between 2 and 5 spans the EGN curve of Fig. 1(a) lies up to 0.9 dB below the EGN formulas of the same paper; the first-order perturbation of the Manakov equation (validation/tests/carena2014.rs) follows the formulas"
cases:
  - {inputs: {spans: 1, model: gn}, expected: 22.3, tolerance: {atol: 0.2}}
  - {inputs: {spans: 1, model: egn}, expected: 18.1, tolerance: {atol: 0.25}}
  - {inputs: {spans: 10, model: gn}, expected: 34.5, tolerance: {atol: 0.2}}
  - {inputs: {spans: 10, model: egn}, expected: 32.6, tolerance: {atol: 0.25}}
  - {inputs: {spans: 20, model: gn}, expected: 38.2, tolerance: {atol: 0.2}}
  - {inputs: {spans: 20, model: egn}, expected: 36.5, tolerance: {atol: 0.25}}
  - {inputs: {spans: 50, model: gn}, expected: 42.7, tolerance: {atol: 0.2}}
  - {inputs: {spans: 50, model: egn}, expected: 41.4, tolerance: {atol: 0.25}}
