id: moose1994
title: Frequency offset of OFDM, its interference and its estimation from a repeated symbol
literature: moose1994
source:
  kind: paper
  reference: "P. H. Moose, A technique for orthogonal frequency division multiplexing frequency offset correction, IEEE Trans. Commun. 42(10), 2908-2914, 1994"
  locator: "eqs. (10), (13), (15), (21), (26); Figs. 1 and 3; the example of Sec. IV"
  file: synchronisation/1994_moose_ofdm-frequency-offset-correction_tcom.pdf
description: >
  The interference of eq. (10) (comrs::waveform::ofdm::sync::ici_power), the bound of
  eq. (15) (cfo_snr_bound) and the estimate of eq. (21) from a repeated block (moose),
  with N = 256 and 193 subcarriers (K = 96), 8PSK for Fig. 1; the offset is applied by
  comrs::hardware::oscillator::frequency_offset and the noise by
  comrs::channel::awgn::add_noise.
run:
  test: validation/tests/moose1994.rs
tier: campaign
duration: "about 2 s on an Apple M6"
findings:
  - "Fig. 1: the simulated SNR after the DFT (8PSK, Ec/N0 = 29 dB) agrees with the experiment points up to an offset of 0.15 but lies 1.3, 1.6 and 2.5 dB below them at 0.25, 0.35 and 0.5; the simulation equals the exact sum of eq. (10), and Pollet et al. 1995 (eq. (6), card pollet1995) show that the useful power and the interference sum to one, which caps the SNR at -1.67 dB at an offset of 0.5 on a full grid: the points of Fig. 1 near +1 dB are not possible"
  - "the text says the bound of eq. (15) is tight for small offsets and about 3 dB low at 0.5; the exact interference of eq. (10) gives the opposite at Ec/N0 = 29 dB: the bound is 2.3 dB low at an offset of 0.05 to 0.15 and 0.15 dB low at 0.5 (the constant 0.5947 is reached at 0.5 only; at small offsets the sum is 0.33 sin^2)"
  - "Sec. III-A cites eq. (25) for the variance; it is eq. (26)"
cases:
  - inputs: {part: example, quantity: sigma_initial}
    expected: 0.0063
    tolerance: {atol: 5.0e-5}
    why: "printed to two significant digits"
    note: "Es/N0 = 28 dB for the shortened symbols: eq. (26) gives 0.00634"
  - inputs: {part: example, quantity: sigma_data}
    expected: 0.025
    tolerance: {atol: 5.0e-4}
    why: "printed to two significant digits"
    note: "the shortened symbols have four times the carrier spacing"
  - inputs: {part: example, quantity: sir_db}
    expected: 24.3
    tolerance: {atol: 0.1}
    why: "printed to 0.1 dB; the paper evaluates eq. (13) at the rounded 0.025 (24.36 dB), the test at 0.0253 (24.24 dB)"
  - inputs: {part: example, quantity: snr_loss_db}
    expected: 0.2
    tolerance: {atol: 0.06}
    why: "printed to 0.1 dB"
  - inputs: {part: interference, quantity: worst_sum_at_half_spacing}
    expected: {max: 0.5947}
    note: "eq. (13): the bound of the sum of eq. (10) for |eps| <= 1/2, determined numerically by the paper; the exact maximum is 0.5937"
  - inputs: {part: bound, ec_n0_db: 29, eps: 0.1}
    expected: 12.3
    tolerance: {atol: 0.3}
    why: "the solid line of Fig. 1, read to about 0.2 dB"
  - inputs: {part: bound, ec_n0_db: 29, eps: 0.5}
    expected: -1.5
    tolerance: {atol: 0.3}
    why: "the solid line of Fig. 1, read to about 0.2 dB"
  - inputs: {part: bound, ec_n0_db: 11, eps: 0.25}
    expected: 3.3
    tolerance: {atol: 0.3}
    why: "the solid line of Fig. 1, read to about 0.2 dB"
  - inputs: {part: experiment, ec_n0_db: 29, eps: 0.05}
    expected: 20.0
    tolerance: {atol: 1.0}
    why: "an experiment point of Fig. 1, read to about 0.5 dB; the simulation of 200 blocks of 193 subcarriers is precise to 0.1 dB"
  - inputs: {part: experiment, ec_n0_db: 29, eps: 0.1}
    expected: 14.0
    tolerance: {atol: 1.0}
    why: "an experiment point of Fig. 1, read to about 0.5 dB; the simulation is precise to 0.1 dB"
  - inputs: {part: experiment, ec_n0_db: 29, eps: 0.15}
    expected: 11.4
    tolerance: {atol: 1.0}
    why: "an experiment point of Fig. 1, read to about 0.5 dB; the simulation is precise to 0.1 dB"
  - inputs: {part: experiment, ec_n0_db: 11, eps: 0.1}
    expected: 9.7
    tolerance: {atol: 1.0}
    why: "an experiment point of Fig. 1, read to about 0.5 dB; the simulation is precise to 0.1 dB"
  - inputs: {part: estimate, es_n0_db: 22, eps: 0.0}
    expected: 1.7e-2
    tolerance: {rtol: 0.2}
    why: "Fig. 3 read on log axes to about 10 %; the 100 trials of the paper leave about 7 % on each of its points, the 2000 of the test 1.6 %"
    note: "the simulation of the paper, 1.35 times eq. (26) at 22 dB where the high-SNR approximation fails, as the test finds"
  - inputs: {part: estimate, es_n0_db: 30, eps: 0.0}
