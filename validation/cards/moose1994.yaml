  - inputs: {part: estimate, es_n0_db: 40, eps: 0.45}
    expected: 1.75e-3
    tolerance: {rtol: 0.2}
    why: "Fig. 3 read on log axes to about 10 %; the 100 trials of the paper leave about 7 % on each of its points, the 2000 of the test 1.6 %"
