id: radhakrishnan1997_fig1
title: The Manakov solver against the exact inelastic collision of two bright solitons
literature: radhakrishnan1997
source:
  kind: paper
  reference: "R. Radhakrishnan, M. Lakshmanan, J. Hietarinta, Inelastic collision and switching of coupled bright solitons in optical fibers, Phys. Rev. E 56(2), 2213-2216, 1997 (arXiv solv-int/9703008)"
  locator: "eqs. (1), (7)-(14) (the two-soliton solution), (15)-(21) (the transition amplitudes), Fig. 1 (k1 = 1 + i, k2 = 2 - i, beta_i = 1, alpha_1 = 1, alpha_2 = (39 + 80 i)/89)"
  file: fiber/1997_radhakrishnan_manakov-soliton-collisions_pre_arxiv.pdf
description: >
  The collision of Fig. 1 in physical units (T0 = 1 ps, beta2 = -20 ps2/km, gamma =
  1.3 /(W km), the normalised distance x = 1 being 0.1 km), launched with the exact
  solution at x = -3 and compared with it at x = +3 (0.6 km, 2048 samples over 60 ps),
  by com_math::nlse::ManakovSplitStep with constant steps, the phase at the middle of
  the step and the trapezoidal phase of OptiCommPy (iterated to 1e-14). The share of
  the energy of soliton 1 (the half t > 0 of the window after the collision) in
  component 1 is compared with eq. (16) of the paper.
run:
  test: validation/tests/radhakrishnan1997.rs::the_manakov_solver_follows_the_inelastic_collision_of_fig_1
tier: campaign
duration: "3.4 s on an Apple M6 (release)"
why: >
  the exact solution has no reading error: the energy shares agree to the overlap of
  the solitons in a half window (1e-3); both schemes are second order (1.8 to 2.2 for a
  step ratio of 2), and over a factor 100 in the step if no other error (the time grid,
  the window) sets a floor
findings:
  - "soliton 1 holds half its energy in each component before the collision and 0.39 % in component 1 after it by eq. (16); the exact solution gives 0.39 % in the half window, the Manakov solver 0.40 % (midpoint) and 0.38 % (trapezoidal) with 600 steps: the coupling of the polarisations and the inelastic switching of Fig. 1 are reproduced"
  - "both schemes are second order (1.99 and 2.01) and the midpoint error keeps falling as h^2 from 600 to 60 000 steps (2.37e-2 to 2.37e-6, order 1.9994): no floor from the time grid or the window"
  - "at equal steps the trapezoidal phase is 5 times more accurate here (4.6e-3 against 2.4e-2 at 600 steps), the reverse of the collision of solitons 800 GHz apart (card sinkin2003_exact, 6.4 times less accurate): this collision is strongly nonlinear with little walk-off. Its iterations cost: at equal time the midpoint step is more accurate (3.7e-4 with 4800 steps in 0.24 s against 4.6e-3 for the trapezoidal step iterated to 1e-14 in 0.24 s; with OptiCommPy's tolerance 1e-5, 4.6e-3 in 0.074 s, where the midpoint step gives about 4e-3)"
cases:
  - {inputs: {quantity: share_in_component_1_after, source: eq_16}, expected: {max: 0.1}, note: "Fig. 1: almost all the energy of soliton 1 in component 2"}
  - {inputs: {quantity: share_in_component_1_after, source: exact_solution}, expected: 0.0, tolerance: {atol: 0.1}}
  - {inputs: {solver: midpoint, quantity: share_in_component_1_after}, expected: 0.0, tolerance: {atol: 0.1}}
  - {inputs: {solver: trapezoidal, quantity: share_in_component_1_after}, expected: 0.0, tolerance: {atol: 0.1}}
  - {inputs: {solver: midpoint, quantity: order}, expected: {min: 1.8, max: 2.2}}
  - {inputs: {solver: trapezoidal, quantity: order}, expected: {min: 1.8, max: 2.2}}
  - {inputs: {solver: midpoint, steps: 600, quantity: error}, expected: {max: 1.0}}
  - {inputs: {solver: trapezoidal, steps: 600, quantity: error}, expected: {max: 1.0}}
  - {inputs: {solver: midpoint, quantity: order_600_to_60000_steps}, expected: {min: 1.9, max: 2.1}}
