# Hybrid Raman/EDFA amplification of a WDM link against the generalised GN model: five
# dual-polarisation channels at 32 GBd on a 50 GHz grid, root-raised-cosine spectra
# (roll-off 0.1), three spans of 100 km of standard fibre. Every span is pumped
# backwards at 1450 nm (13.4 THz above the channels, near the peak of the Raman gain of
# silica); an EDFA of noise figure 5 dB with an ideal gain-flattening filter then
# restores every frequency to its launch power. The channels propagate together by the
# Manakov equation with the power profile of the span (the coupled equations of
# stimulated Raman scattering, solved for the slices of the spectrum of the field at
# the input of every span), the spontaneous Raman noise of the pump and the ASE of the
# EDFA, with the step rule of Musetti et al. 2018 (the same SNR as fixed steps of
# 0.25 km); OptiCommPy's 0.02 rad of nonlinear phase per step leaves 0.4 dB of error at
# the highest powers with the pump. The centre channel is received by an ideal coherent receiver, dispersion
# compensation and a matched filter; frame synchronisation removes the delay and the
# mean nonlinear phase only.
#
# The counter-propagating pump lifts the power at the end of the span: the noise falls
# (the EDFA has less to compensate) and the nonlinear interference grows (a longer
# effective length). With Gaussian symbols the simulated SNR follows the GN model with
# the power profiles of the channels (Semrau, Killey & Bayvel 2019) in every regime,
# without the pump (pump_mw: 0, the EDFA alone) and with it. The model is checked
# against GNPy in tests/test_gnpy_oracle.py.
name: raman_wdm
description: Counter-pumped hybrid Raman/EDFA WDM link against the generalised GN model
seed: 7
batch: 4
fiber: &fiber {n_spans: 3, span_km: 100, alpha_db_km: 0.2, d_ps_nm_km: 16, gamma_w_km: 1.3, nf_db: 5}
grid:
  pump_mw: [0, 500]
  power_dbm: [-10, -6, -2, 2]
link:
  - {type: source, constellation: gaussian, n_symbols: 4096, symbol_rate: 32e9, pols: 2}
  - {type: wdm_tx, n_channels: 5, spacing_hz: 50e9, sps: 8, power_dbm: $power_dbm, rolloff: 0.1}
  - type: manakov
    fiber: {raman: {pumps: [{wavelength_nm: 1450, power_mw: $pump_mw, direction: counter}]}}
  - {type: wdm_rx, sps: 2}
  - cdc
  - {type: matched_filter, rolloff: 0.1}
  - decimate
  - {type: frame_sync, start: 1024, length: 512, max_delay: 16, symmetry: 0}
metrics: {report: [snr_db], skip_start: 256, skip_end: 256}
stop: {min_trials: 8, max_trials: 8}
expect:
  - name: SNR of Gaussian symbols, the GN model with Raman power profiles
    source: D. Semrau, R. I. Killey and P. Bayvel, "A closed-form approximation of the Gaussian noise model in the presence of inter-channel stimulated Raman scattering," J. Lightw. Technol., 37(9), 2019, eq. (2); J. Bromage, "Raman amplification for fiber communications systems," J. Lightw. Technol., 22(1), 2004
    metric: snr_db
    theory:
      function: gn_snr_db
      fiber:
        n_spans: 3
        span_km: 100
        alpha_db_km: 0.2
        d_ps_nm_km: 16
        gamma_w_km: 1.3
        nf_db: 5
        raman: {pumps: [{wavelength_nm: 1450, power_mw: $pump_mw, direction: counter}]}
      n_channels: 5
      spacing_hz: 50e9
      symbol_rate: 32e9
      rolloff: 0.1
      power_dbm: $power_dbm
    atol: 0.4
