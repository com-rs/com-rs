# Launch-power sweep of a dual-polarisation 16-QAM WDM link against the GN model: five
# channels at 32 GBd on a 50 GHz grid, root-raised-cosine spectra (roll-off 0.1), five
# spans of 80 km of standard fibre with EDFAs (noise figure 4.5 dB). The channels
# propagate together by the Manakov equation (the phase at the middle of the step, the
# step rule of Musetti et al. 2018 and 12 samples per symbol, as in specs/wdm_gn.yaml);
# the centre channel is received by an ideal coherent receiver followed by dispersion
# compensation, matched filtering, blind phase search and frame synchronisation.
#
# At low power the SNR is that of the ASE of the amplifiers; above the optimum the
# nonlinear interference, growing as P³, makes the SNR fall by 2 dB per dB. The
# practical receiver (blind phase search) also removes a part of the cross-phase
# modulation, so that the SNR above the optimum is about 2 dB above the GN model; see
# wdm_gn.yaml for the comparison with the GN model itself.
name: wdm_dp16qam
description: DP-16QAM 5 x 32 GBd over 5 x 80 km, SNR against the GN model
seed: 11
batch: 4
fiber: &fiber {n_spans: 5, span_km: 80, alpha_db_km: 0.2, d_ps_nm_km: 16, gamma_w_km: 1.3, nf_db: 4.5}
grid:
  power_dbm: [-8, -6, -4, -2, 0, 2, 4]
link:
  - {type: source, constellation: 16-QAM, n_symbols: 4096, symbol_rate: 32e9, pols: 2}
  - {type: wdm_tx, n_channels: 5, spacing_hz: 50e9, sps: 12, power_dbm: $power_dbm, rolloff: 0.1}
  - manakov
  - {type: wdm_rx, sps: 2}
  - cdc
  - {type: matched_filter, rolloff: 0.1}
  - decimate
  - {type: bps, n: 32, b: 32}
  - {type: frame_sync, start: 1024, length: 512, max_delay: 16}
metrics: {report: [snr_db, ber, gmi], skip_start: 256, skip_end: 256}
stop: {min_trials: 8, max_trials: 8}
expect:
  - name: ASE-limited SNR
    source: the ASE of the EDFAs, Essiambre et al., J. Lightw. Technol., 28(4), 2010, eq. (54)
    where: {power_dbm: -8}
    metric: snr_db
    theory: {function: gn_snr_db, fiber: *fiber, n_channels: 5, spacing_hz: 50e9, symbol_rate: 32e9, rolloff: 0.1, power_dbm: $power_dbm}
    atol: 0.3
