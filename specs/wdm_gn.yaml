# The nonlinear interference of a WDM link against the GN model (Poggiolini 2012):
# five dual-polarisation channels at 32 GBd on a 50 GHz grid, root-raised-cosine
# spectra (roll-off 0.1), five spans of 80 km of standard fibre with EDFAs of noise
# figure 4.5 dB, propagated together by the Manakov equation (OptiCommPy's manakovSSF).
# The centre channel is received by an ideal coherent receiver, dispersion
# compensation and a matched filter; frame synchronisation removes the delay and the
# mean nonlinear phase only (no carrier recovery, which would also remove a part of the
# interference).
#
# The GN model treats the transmitted signal as Gaussian noise. With Gaussian symbols
# the simulated SNR must therefore follow it in every regime: the ASE at low power, the
# interference growing as P³ above the optimum. With 16-QAM the interference is lower:
# the SNR above the optimum is about 1.5 dB higher than the GN model, and follows the EGN
# model of Carena et al. 2014 (the GN model corrected for the fourth and sixth moments
# of the constellation) within 0.35 dB.
name: wdm_gn
description: Manakov WDM propagation against the GN model (Gaussian symbols) and the EGN model (16-QAM)
seed: 5
batch: 4
fiber: &fiber {n_spans: 5, span_km: 80, alpha_db_km: 0.2, d_ps_nm_km: 16, gamma_w_km: 1.3, nf_db: 4.5}
grid:
  format: [gaussian, 16-QAM]
  power_dbm: [-8, -6, -4, -2, 0, 2, 4]
link:
  - {type: source, constellation: $format, n_symbols: 4096, symbol_rate: 32e9, pols: 2}
  - {type: wdm_tx, n_channels: 5, spacing_hz: 50e9, sps: 8, power_dbm: $power_dbm, rolloff: 0.1}
  - manakov
  - {type: wdm_rx, sps: 2}
  - cdc
  - {type: matched_filter, rolloff: 0.1}
  - decimate
  - {type: frame_sync, start: 1024, length: 512, max_delay: 16, symmetry: 0}
metrics: {report: [snr_db], skip_start: 256, skip_end: 256}
stop: {min_trials: 8, max_trials: 8}
expect:
  - name: SNR of Gaussian symbols, the GN model
    source: P. Poggiolini, "The GN model of non-linear propagation in uncompensated coherent optical systems," J. Lightw. Technol., 30(24), 2012
    where: {format: gaussian}
    metric: snr_db
    theory: &gn {function: gn_snr_db, fiber: *fiber, n_channels: 5, spacing_hz: 50e9, symbol_rate: 32e9, rolloff: 0.1, power_dbm: $power_dbm}
    atol: 0.4
  - name: SNR of 16-QAM, the EGN model
    source: A. Carena, G. Bosco, V. Curri, Y. Jiang, P. Poggiolini and F. Forghieri, "EGN model of non-linear fiber propagation," Opt. Express, 22(13), 2014, eqs. (5)-(9), (14)-(17)
    where: {format: 16-QAM}
    metric: snr_db
    theory: {function: gn_snr_db, fiber: *fiber, n_channels: 5, spacing_hz: 50e9, symbol_rate: 32e9, rolloff: 0.1, power_dbm: $power_dbm, format: 16-QAM}
    atol: 0.4
