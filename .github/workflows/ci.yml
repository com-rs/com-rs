name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # the specifications of specs/validation checked on every push (`just check` runs the
  # same list); dvbs2_table13 and required_snr are long searches
  VALIDATION_SPECS: >-
    specs/validation/proakis_awgn.yaml
    specs/validation/information_rates.yaml
    specs/validation/hager2021_fig5.yaml
    specs/validation/msk_bpsk.yaml
    specs/validation/thompson2008_eq15.yaml

jobs:
  # The order of docs/ARCHITECTURE.md ("Automation"); `just check` runs the same
  # commands.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps --exclude com-py
        env:
          RUSTDOCFLAGS: --html-in-header ${{ github.workspace }}/docs/katex-header.html -D warnings
      - name: every crate ships the same KaTeX header
        run: for c in crates/*/; do cmp docs/katex-header.html "$c/katex-header.html"; done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test          # default-members: all crates but the Python extension
      - name: results against the literature
        shell: bash
        run: cargo run --release -p com-spec --bin comrs -- verify $VALIDATION_SPECS

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        # pip >= 25.1 installs the dependency groups of pyproject.toml; the oracles
        # (OptiCommPy, GNPy) are recorded fixtures of tests/oracle/: the tools are not
        # installed, the tests read the files. The scripts of a venv are in bin/, or
        # in Scripts/ on Windows.
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install maturin --group test --group lint
          maturin develop --release
      - name: lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          source .venv/bin/activate
          ruff check python tests docs/python tools
          ruff format --check python tests docs/python tools
          python tools/api_index.py --check
          # the generated stub of the extension and classes of the blocks
          python tools/gen_stubs.py --check
          python tools/gen_blocks.py --check
      - name: tests
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          python -m pytest

  # The documentation of the Python package (Sphinx, PyData theme, gallery of classical
  # results), published to GitHub Pages from main (Settings → Pages → GitHub Actions).
  docs-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install maturin --group docs
          maturin develop --release
          sphinx-build -W --keep-going -b html docs/python docs/python/_build/html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/python/_build/html

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-python
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one deployment at a time; a deployment in progress is never cancelled
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
