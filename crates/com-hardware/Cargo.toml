[package]
name = "com-hardware"
description = "Hardware impairments of com-rs: power amplifiers and predistortion, phase noise, lasers, optical modulators, photodiodes, coherent receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/com-hardware"
keywords = ["power-amplifier", "phase-noise", "predistortion", "laser", "optics"]
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[lints]
workspace = true

[dependencies]
com-core.workspace = true
com-math.workspace = true
com-dsp.workspace = true

[features]
default = ["optical"]
# lasers, modulators, photodiodes, optical hybrid, coherent receiver
optical = []
